<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Coding problems with test cases and five implementations each."
    />
    <title>Algorithm Quest</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Algorithm Quest home">
        <span class="brand-mark" aria-hidden="true">{ }</span>
        <span class="brand-text">Algorithm Quest</span>
      </a>
      <span class="topbar-stats" id="topbar-stats"></span>
    </header>

    <main id="app" class="app" tabindex="-1"></main>

    <footer class="footer">
      <p>Every problem ships with five implementations, all checked against the same test suite.</p>
      <p class="muted">Tap a folder, then a problem, to read the statement, tests and solutions.</p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
